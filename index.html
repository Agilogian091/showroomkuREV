<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHOWROOMKU</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar-hero.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/contact-footer.css">
</head>
<body>

  <!-- NAVBAR: dikerjakan di branch feature/navbar -->

  <main>
    <!-- HERO: dikerjakan di branch feature/hero -->

    <!-- ABOUT: dikerjakan di branch feature/about -->

    <!-- KATALOG: dikerjakan di branch feature/catalog -->

    <!-- KONTAK: dikerjakan di branch feature/contact -->
    <!-- ===== CONTACT ===== -->
    <section id="kontak" class="contact">
      <div class="section-head">
        <h2>Hubungi kami</h2>
        <p>Isi formulir singkat, pesan akan terbuka di WhatsApp showroom.</p>
      </div>

      <div class="contact-grid">
        <ul class="contact-info">
          <li><strong>Alamat</strong><span>Jl. Contoh Raya No. 123, Purwokerto</span></li>
          <li><strong>Jam buka</strong><span>Senin–Sabtu, 09.00–17.00 WIB</span></li>
          <li><strong>Telepon</strong><span>0812-0000-0000</span></li>
          <li><strong>Instagram</strong><span><a href="https://instagram.com/" target="_blank" rel="noopener">@showroomku</a></span></li>
        </ul>

        <form class="contact-form" id="contactForm">
          <label for="nama">Nama</label>
          <input id="nama" name="nama" type="text" required autocomplete="name">

          <label for="minat">Mobil yang diminati</label>
          <select id="minat" name="minat">
            <option>Belum tahu, mau konsultasi</option>
            <option>Sedan</option>
            <option>SUV</option>
            <option>MPV</option>
            <option>Hatchback</option>
          </select>

          <label for="pesan">Pesan</label>
          <textarea id="pesan" name="pesan" rows="4" placeholder="Contoh: Saya mau lihat unit hari Sabtu."></textarea>

          <button type="submit" class="btn btn-primary">Kirim lewat WhatsApp</button>
        </form>
      </div>
    </section>
  </main>

  <!-- FOOTER: dikerjakan di branch feature/footer -->

  <script src="js/main.js"></script>
</body>
</html>
