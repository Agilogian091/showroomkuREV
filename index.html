<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHOWROOMKU</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar-hero.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/contact-footer.css">
</head>
<body>

  <!-- NAVBAR: dikerjakan di branch feature/navbar -->

  <main>
    <!-- HERO: dikerjakan di branch feature/hero -->
    <!-- ===== HOME / HERO ===== -->
    <section id="home" class="hero">
      <div class="hero-text">
        <h1>Temukan mobil yang cocok, di showroom yang jujur.</h1>
        <p>SHOWROOMKU menyediakan mobil baru dan bekas pilihan. Setiap unit sudah diperiksa, harganya jelas, dan tim kami siap menemani sampai kunci berpindah tangan.</p>
        <div class="hero-actions">
          <a href="#katalog" class="btn btn-primary">Lihat katalog mobil</a>
          <a href="#kontak" class="btn btn-ghost">Jadwalkan kunjungan</a>
        </div>
      </div>

      <div class="hero-stage">
        <svg class="hero-car" viewBox="0 0 400 160" role="img" aria-label="Siluet mobil dengan warna yang bisa diganti"><use href="#car"/></svg>
        <div class="swatches" role="radiogroup" aria-label="Pilih warna cat">
          <button class="swatch is-active" role="radio" aria-checked="true" data-color="#1F4FD8" data-name="Biru Kobalt" style="--c:#1F4FD8"></button>
          <button class="swatch" role="radio" aria-checked="false" data-color="#C8312B" data-name="Merah Marun" style="--c:#C8312B"></button>
          <button class="swatch" role="radio" aria-checked="false" data-color="#2E7D5B" data-name="Hijau Hutan" style="--c:#2E7D5B"></button>
          <button class="swatch" role="radio" aria-checked="false" data-color="#D9DDE2" data-name="Perak Metalik" style="--c:#D9DDE2"></button>
          <button class="swatch" role="radio" aria-checked="false" data-color="#222831" data-name="Hitam Grafit" style="--c:#222831"></button>
        </div>
        <p class="swatch-label" id="swatchLabel" aria-live="polite">Warna: Biru Kobalt</p>
      </div>
    </section>

    <!-- ABOUT: dikerjakan di branch feature/about -->

    <!-- KATALOG: dikerjakan di branch feature/catalog -->

    <!-- KONTAK: dikerjakan di branch feature/contact -->
  </main>

  <!-- FOOTER: dikerjakan di branch feature/footer -->

  <script src="js/main.js"></script>
</body>
</html>
